name: Build IPA (xiaozhi-ios)

# 手动触发；也支持 push 到 main 自动构建（见下方 on.push）。
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'App Bundle Identifier（覆盖工程里的空值）'
        required: true
        default: 'com.zrtnb.xiaozhi'
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  # 如需提交即自动构建，取消下一行的注释：
  # push:
  #   branches: [main]

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Project info
        run: xcodebuild -list -project xiaozhi.xcodeproj

      # ---- 可选：签名材料导入（仅在仓库配置了 Secrets 时执行）----
      - name: Import signing certificate & provisioning profile
        if: ${{ secrets.P12_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Build (signed)
        if: ${{ secrets.P12_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          PROFILE_SPEC: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -e
          xcodebuild build \
            -project xiaozhi.xcodeproj \
            -target xiaozhi \
            -configuration "${{ github.event.inputs.configuration }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPEC"

      - name: Build (unsigned)
        if: ${{ secrets.P12_BASE64 == '' || secrets.PROVISIONING_PROFILE_BASE64 == '' }}
        run: |
          set -e
          xcodebuild build \
            -project xiaozhi.xcodeproj \
            -target xiaozhi \
            -configuration "${{ github.event.inputs.configuration }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ github.event.inputs.bundle_id }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/build/Build/Products/${{ github.event.inputs.configuration }}-iphoneos/xiaozhi.app"
          if [ ! -d "$APP" ]; then
            echo "::error::未找到编译产物 $APP"
            ls -R "$RUNNER_TEMP/build/Build/Products" || true
            exit 1
          fi
          cd "$(dirname "$APP")"
          mkdir -p Payload
          cp -r xiaozhi.app Payload/
          zip -r "$RUNNER_TEMP/xiaozhi.ipa" Payload
          rm -rf Payload
          echo "IPA 大小：$(du -h "$RUNNER_TEMP/xiaozhi.ipa" | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-ipa
          path: ${{ runner.temp }}/xiaozhi.ipa
          if-no-files-found: error
