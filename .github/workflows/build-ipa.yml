name: Build IPA (xiaozhi-ios)

# 手动触发；如需「提交即构建」可自行添加 push 触发器。
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'App Bundle Identifier（覆盖工程里的空值）'
        required: true
        default: 'com.zrtnb.xiaozhi'
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Project info
        run: xcodebuild -list -project xiaozhi.xcodeproj

      - name: Diagnostics (architectures)
        run: |
          echo "==> 查找静态库并查看架构"
          find . -name "*.a" -not -path "*/.*" | while read f; do
            echo "--- $f"; xcrun lipo -info "$f" 2>&1 || true
          done
          echo "==> 可用 SDK"
          xcodebuild -showsdks 2>&1 | grep -i iphoneos || true

      # 工程引用了第三方框架 YbridOpus.xcframework（libopus 1.3.1 的 Swift 封装，
      # 用于语音 Opus 编解码），作者未将其纳入仓库，路径写死在 ~/Downloads。
      # 这里从上游发布包下载并解压到该路径，使编译/打包能够继续。
      - name: Fetch YbridOpus XCFramework
        run: |
          set -euo pipefail
          DOWNLOADS_DIR="$GITHUB_WORKSPACE/../../Downloads"
          mkdir -p "$DOWNLOADS_DIR"
          echo "==> 下载 YbridOpus.xcframework (ybrid/opus-swift 0.8.0) 到 $DOWNLOADS_DIR"
          curl -fSL -o /tmp/YbridOpus.xcframework.zip \
            https://github.com/ybrid/opus-swift/releases/download/0.8.0/YbridOpus.xcframework.zip
          unzip -o -q /tmp/YbridOpus.xcframework.zip -d "$DOWNLOADS_DIR"
          echo "==> 解压结果:"
          ls -la "$DOWNLOADS_DIR/YbridOpus.xcframework"
          echo "==> 框架包含的切片:"
          find "$DOWNLOADS_DIR/YbridOpus.xcframework" -maxdepth 3 -name '*.framework' -o -maxdepth 3 -name '*.a' | head

      # 单个步骤内判断：若仓库配置了签名 Secrets 则走签名路径，否则走未签名路径。
      # （GitHub 不允许在 if: 条件里直接引用 secrets 上下文，故用 shell 判断。）
      - name: Build & Package IPA
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          PROFILE_SPEC: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
          INPUT_BUNDLE_ID: ${{ github.event.inputs.bundle_id }}
          CONFIG: ${{ github.event.inputs.configuration }}
        run: |
          set -e
          SIGNED=false
          if [ -n "$P12_BASE64" ] && [ -n "$PROFILE_BASE64" ]; then
            SIGNED=true
            echo "==> 检测到签名材料，走签名路径"
            KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
            cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          else
            echo "==> 未检测到签名材料，走未签名路径（产物无法安装到真机）"
          fi

          XCB_ARGS=(
            -project xiaozhi.xcodeproj
            -target xiaozhi
            -configuration "$CONFIG"
            -sdk iphoneos
            -destination 'generic/platform=iOS'
          )
          if [ "$SIGNED" = true ]; then
            XCB_ARGS+=(PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID")
            XCB_ARGS+=(DEVELOPMENT_TEAM="$TEAM_ID")
            XCB_ARGS+=(CODE_SIGN_STYLE=Manual)
            XCB_ARGS+=(CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY")
            XCB_ARGS+=(PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPEC")
          else
            XCB_ARGS+=(PRODUCT_BUNDLE_IDENTIFIER="$INPUT_BUNDLE_ID")
            XCB_ARGS+=(CODE_SIGNING_ALLOWED=NO)
            XCB_ARGS+=(CODE_SIGN_IDENTITY="")
            XCB_ARGS+=(DEVELOPMENT_TEAM="")
          fi

          xcodebuild build "${XCB_ARGS[@]}"

          APP=$(find "$GITHUB_WORKSPACE/build" "$HOME/Library/Developer/Xcode/DerivedData" -type d -name xiaozhi.app 2>/dev/null | head -1)
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::未找到编译产物 xiaozhi.app"
            find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" 2>/dev/null | head || true
            exit 1
          fi

          # 未签名路径：剥离嵌入框架里的非 arm64 切片（如 32 位 arm），
          # 否则多数签名工具/真机会在签名或安装阶段失败（曾报「无法连接服务器」）。
          if [ "$SIGNED" != true ]; then
            echo "==> 精简嵌入框架架构（仅保留 arm64）"
            while IFS= read -r fw; do
              [ -d "$fw" ] || continue
              bin="$fw/$(basename "$fw" .framework)"
              [ -f "$bin" ] || continue
              info=$(xcrun lipo -info "$bin" 2>/dev/null || true)
              if echo "$info" | grep -q "fat file"; then
                xcrun lipo -thin arm64 "$bin" -output "$bin.thin" && mv "$bin.thin" "$bin" \
                  && echo "    已精简: $bin"
              fi
            done < <(find "$APP/Frameworks" -name '*.framework')
          fi

          cd "$(dirname "$APP")"
          mkdir -p Payload
          cp -r xiaozhi.app Payload/
          zip -r "$RUNNER_TEMP/xiaozhi.ipa" Payload
          rm -rf Payload
          echo "IPA 大小：$(du -h "$RUNNER_TEMP/xiaozhi.ipa" | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-ipa
          path: ${{ runner.temp }}/xiaozhi.ipa
          if-no-files-found: error
